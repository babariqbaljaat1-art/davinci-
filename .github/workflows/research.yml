# Research data: multi-year Dukascopy candles for honest backtests of the course rules.
# Runs only when research/ changes or by hand. Output goes to the research-data branch.
name: research-data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/**']

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Dukascopy M1 -> 5m
        run: python research/dukascopy.py 2022-11-01 2026-10-31
      - name: Save to the research-data branch
        run: |
          cd duka
          git init -q -b research-data
          git config user.name davinci-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -q -m "dukascopy 5m $(date -u +%F)"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" research-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
